
id = "shell-slash-command"
name = "Shell Command"
description = "Run shell commands with the /sh slash command"
version = "0.1.0"
schema_version = 1
authors = ["Tom Aylott <oblivious@subtleGradient.com>"]
repository = "https://github.com/subtleGradient/zed-shell-slash-command"

[slash_commands.sh]
description = "Run a shell command and return the output"
requires_argument = true

[[capabilities]]
kind = "process:exec"
command = "sh"
args = ["-c", "*"]
